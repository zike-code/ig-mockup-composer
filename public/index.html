<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IG Mockup Composer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>IG Mockup Composer</h1>
        <p class="subtitle">Batch-fit videos into the mockup's rectangle</p>
      </header>

      <div class="layout">
        <div class="canvas-col">
          <div id="canvasWrap" class="canvas-wrap">
            <canvas id="canvas" width="1080" height="1920"></canvas>
            <div id="canvasEmpty" class="canvas-empty">Choose a background image to start</div>
          </div>
          <div class="rect-controls">
            <label>X <input id="rx" type="number" value="180" /></label>
            <label>Y <input id="ry" type="number" value="430" /></label>
            <label>Width <input id="rw" type="number" value="720" /></label>
            <label>Height <input id="rh" type="number" value="1242" /></label>
          </div>
          <div class="row">
            <button id="previewBtn" class="secondary" disabled>Preview with first video</button>
          </div>
        </div>

        <div class="panel-col">
          <section class="card">
            <h2>1. Background images (cycle per video)</h2>
            <button id="pickBackgroundBtn">Choose image(s)...</button>
            <div id="backgroundPath" class="path-label">None chosen</div>
            <div id="backgroundList" class="background-list"></div>
          </section>

          <section class="card">
            <h2>2. Video folder</h2>
            <button id="pickInputBtn">Choose folder...</button>
            <div id="inputPath" class="path-label">None chosen</div>
            <div id="videoCount" class="hint"></div>
          </section>

          <section class="card">
            <h2>3. Output folder</h2>
            <button id="pickOutputBtn">Choose folder...</button>
            <div id="outputPath" class="path-label">None chosen</div>
          </section>

          <section class="card">
            <h2>4. Process</h2>
            <div class="row">
              <button id="processBtn" disabled>Start processing</button>
              <button id="pauseBtn" class="secondary" disabled>Pause</button>
              <button id="stopBtn" class="secondary" disabled>Stop</button>
            </div>
            <div id="progressBar" class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
            <div id="progressLabel" class="hint"></div>
            <div id="videoList" class="video-list"></div>
          </section>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
